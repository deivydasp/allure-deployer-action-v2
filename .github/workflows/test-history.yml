name: "Test: History Tracking"
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: read

jobs:
  deploy-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: First deploy
        uses: ./
        with:
          allure_results_path: 'test-fixtures/passing'
          prefix: 'test-history'
          report_name: 'History Test'

  deploy-second:
    needs: deploy-first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Second deploy
        id: deploy
        uses: ./
        with:
          allure_results_path: 'test-fixtures/passing'
          prefix: 'test-history'
          report_name: 'History Test'

      - name: Verify history has 2 entries
        run: |
          git fetch origin gh-pages --depth=1
          git checkout origin/gh-pages -- .
          LINES=$(wc -l < test-history/history/history.jsonl)
          echo "History entries: $LINES"
          if [ "$LINES" -lt 2 ]; then
            echo "::error::Expected at least 2 history entries, got $LINES"
            exit 1
          fi
          echo "=== History content ==="
          cat test-history/history/history.jsonl
          echo "=== Verify history links point to the deployed report ==="
          # Allure writes these from executor.json's reportUrl; a trailing slash would make it link to /awesome/
          REPORT_URL='${{ steps.deploy.outputs.report_url }}'
          LAST_URL=$(tail -n 1 test-history/history/history.jsonl | jq -r '.url')
          TEST_URLS=$(tail -n 1 test-history/history/history.jsonl | jq -r '[.testResults[].url] | unique | join(" ")')
          echo "report_url=$REPORT_URL entry=$LAST_URL tests=$TEST_URLS"
          if [ -z "$REPORT_URL" ] || [ "$LAST_URL" != "$REPORT_URL" ] || [ "$TEST_URLS" != "$REPORT_URL" ]; then
            echo "::error::Latest history entry must link to $REPORT_URL"
            exit 1
          fi
          echo "=== Verify 2 report directories ==="
          DIRS=$(ls -d test-history/[0-9]* | wc -l)
          echo "Report directories: $DIRS"
          if [ "$DIRS" -lt 2 ]; then
            echo "::error::Expected at least 2 report dirs, got $DIRS"
            exit 1
          fi
          echo "=== All checks passed ==="
